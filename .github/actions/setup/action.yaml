name: Setup
description: Common setup for iOS CI

runs:
  using: composite
  steps:
    - name: Mise (Ruby + Tuist + SwiftLint)
      uses: jdx/mise-action@v5

    - name: Cache gems
      uses: actions/cache@v6
      with:
        path: vendor/cache
        key: ${{ runner.os }}-mise-gems-${{ hashFiles('Gemfile.lock') }}

    - name: Install Fastlane with cache
      shell: bash
      run: bundle cache

    - name: Set Xcode 27.0
      shell: bash
      run: sudo xcode-select -s /Applications/Xcode_27.0.app

    - name: Cache Tuist .build
      uses: actions/cache@v6
      with:
        path: Tuist/.build
        key: tuist-cache-${{ hashFiles('Tuist/Package.resolved') }}
        restore-keys: |
          tuist-cache-
